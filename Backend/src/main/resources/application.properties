spring.application.name=sovereign-wealth-ai-core
server.port=8080
server.compression.enabled=true
server.compression.mime-types=application/json,text/plain,text/css,application/javascript
server.compression.min-response-size=1KB
spring.threads.virtual.enabled=true

gemini.api.key=${GEMINI_API_KEY:}
gemini.model=gemini-1.5-flash

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://127.0.0.1:5173,http://127.0.0.1:5174}
